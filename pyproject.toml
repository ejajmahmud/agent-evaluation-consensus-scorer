[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evaluation-consensus-scorer"
version = "0.1.0"
description = "Multi-judge LLM-as-a-judge evaluation aggregator with inter-annotator agreement (Cohen's Kappa) calculation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-evaluation-consensus-scorer = "agent_evaluation_consensus_scorer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_evaluation_consensus_scorer*"]
